name: Build and Deploy CEEBUILD Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push cancels a still-running deploy instead of racing it.
concurrency:
  group: deploy-ceebuild-dashboard
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      owner_lowercase: ${{ steps.repo_owner.outputs.owner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Short Commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Convert Repo Owner to Lowercase (GHCR requirement)
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/ceebuild-dashboard:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/ceebuild-dashboard:${{ steps.vars.outputs.short_sha }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull and Restart Container
        shell: powershell
        working-directory: D:/ceebuild-dashboard
        env:
          APP_VERSION: ${{ needs.build-and-push.outputs.short_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:APP_VERSION = $env:APP_VERSION

          docker compose pull ceebuild-dashboard
          docker compose up -d --no-deps ceebuild-dashboard

          # Keep the latest and the previous image (for rollback); remove older ones.
          $repo = "ghcr.io/${{ needs.build-and-push.outputs.owner_lowercase }}/ceebuild-dashboard"
          $allImages = docker images --filter "reference=$repo" --format "{{.ID}}" | Select-Object -Unique
          $oldImages = $allImages | Select-Object -Skip 2

          if ($oldImages) {
              Write-Host "Cleaning up old images: $oldImages"
              $oldImages | ForEach-Object { docker rmi -f $_ }
          } else {
              Write-Host "No old images to prune. Latest and previous images preserved."
          }

          docker image prune -f
